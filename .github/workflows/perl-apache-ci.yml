name: Perl Apache CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mod-perl:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Apache and mod_perl packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            apache2 \
            apache2-dev \
            libapache2-mod-perl2 \
            libapache2-mod-perl2-dev \
            cpanminus \
            build-essential

      - name: Configure Debian Apache environment
        run: |
          sudo mkdir -p /var/run/apache2 /var/lock/apache2 /var/log/apache2
          sudo tee /etc/apache2/httpd.conf >/dev/null <<'EOF'
          ServerRoot "/etc/apache2"
          DefaultRuntimeDir "/var/run/apache2"
          PidFile "/var/run/apache2/apache2.pid"
          ErrorLog "/var/log/apache2/error.log"
          User www-data
          Group www-data
          LoadModule mpm_event_module /usr/lib/apache2/modules/mod_mpm_event.so
          EOF
          cat > "$RUNNER_TEMP/webdyne-apache2" <<'EOF'
          #!/bin/sh
          for arg in "$@"; do
            case "$arg" in
              -V|-v|-l)
                exec /usr/sbin/apache2 "$arg"
                ;;
            esac
          done
          exec /usr/sbin/apache2 "$@"
          EOF
          chmod 755 "$RUNNER_TEMP/webdyne-apache2"
          echo "APACHE_RUN_DIR=/var/run/apache2" >> "$GITHUB_ENV"
          echo "APACHE_PID_FILE=/var/run/apache2/apache2.pid" >> "$GITHUB_ENV"
          echo "APACHE_RUN_USER=www-data" >> "$GITHUB_ENV"
          echo "APACHE_RUN_GROUP=www-data" >> "$GITHUB_ENV"
          echo "APACHE_LOG_DIR=/var/log/apache2" >> "$GITHUB_ENV"
          echo "APACHE_LOCK_DIR=/var/lock/apache2" >> "$GITHUB_ENV"
          echo "APACHE_TEST_HTTPD=$RUNNER_TEMP/webdyne-apache2" >> "$GITHUB_ENV"
          echo "APACHE_TEST_APXS=/usr/bin/apxs" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cpanm --sudo --notest --installdeps .

      - name: Install optional runtime dependencies
        run: cpanm --sudo --notest --skip-satisfied Plack PAGI::Server PAGI::Tools

      - name: Configure
        run: perl Makefile.PL

      - name: Run tests
        run: make test
