name: Release

on:
  push:
    tags: [ 'v*.*.*' ]   # or any trigger you prefer
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@v1.42.0
        with:
          perl-version: '5.44.0'

      - name: Install build deps
        run: |
          cpanm --installdeps .   # install prerequisites
          cpanm --notest ExtUtils::MakeMaker
          cpanm --notest CPAN::Uploader

      - name: Configure
        run: perl Makefile.PL

      - name: Run tests
        run: make test

      - name: Build and create distribution
        run: make dist

      - name: List generated file
        run: ls -l *.tar.gz
        
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: '*.tar.gz'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Publish to CPAN
        if: github.ref_type == 'tag'
        run: |
          cpan-upload -u ${{ secrets.CPAN_USERNAME }} -p ${{ secrets.CPAN_PASSWORD }} *.tar.gz
