name: Cleanup
on:
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Run retention action
        uses: snok/container-retention-policy@v3.1.0
        with:
          image-names: webdyne
          cut-off: 30d
          keep-n-most-recent: 64
          account: user
          # Use the repository-scoped token so this workflow is not dependent
          # on a long-lived PAT secret.  The package must grant this repository
          # Admin access under the package's "Manage Actions access" settings.
          token: ${{ github.token }}
          dry-run: true
